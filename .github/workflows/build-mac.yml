name: Build & Release Noah Desktop (macOS)

# Trigger: push a tag like  noah-v1.0.1
# What it does:
#   1. Builds the Vite frontend
#   2. If Apple secrets exist: signed + notarized .dmg/.zip and release upload
#   3. If Apple secrets are missing: unsigned .dmg/.zip build + workflow artifacts
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE          — base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD — password for the .p12
#   APPLE_ID                   — your Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD — app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID              — 10-char Team ID (developer.apple.com → Account)
#
# Without Apple secrets, this workflow still passes and uploads unsigned artifacts.

on:
  push:
    tags:
      - 'noah-v*'

permissions:
  contents: write        # needed to create GitHub Releases

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-14    # Apple Silicon runner — fastest native M1 build

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Node setup ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: artifacts/desktop/package-lock.json

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install desktop dependencies
        working-directory: artifacts/desktop
        run: npm ci

      # ── 4. Verify icon exists (committed directly to repo) ──────────────────
      - name: Verify app icon
        run: ls -lh artifacts/desktop/assets/icon.icns

      # ── 5. Detect whether signing + notarization secrets are available ─────
      - name: Detect signing/notarization secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing signing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing/notarization path enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing/notarization secrets incomplete. Using unsigned fallback path."
          fi

      # ── 6. Import Apple Developer certificate ───────────────────────────────
      - name: Import certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 20)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

      # ── 7. Build + package ──────────────────────────────────────────────────
      - name: Build and publish DMG
        if: steps.signing.outputs.enabled == 'true'
        working-directory: artifacts/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#noah-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run release

      # ── 7b. Unsigned fallback build (no release publish) ───────────────────
      - name: Build unsigned mac artifacts
        if: steps.signing.outputs.enabled != 'true'
        working-directory: artifacts/desktop
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#noah-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build:mac

      # ── 8. Clean release notes (remove Replit commit metadata) ────────────
      - name: Set clean release notes
        if: steps.signing.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#noah-v}"
          NOTES="Noah Desktop App v${VERSION} for macOS (Apple Silicon + Intel)"

          # electron-builder now uses "noah-v${version}" as the tag (set in package.json).
          # We also try "v${VERSION}" as a fallback in case of mismatch.
          # Retry up to 5 times (10 s apart) in case the release is still being created.
          for TAG in "noah-v${VERSION}" "v${VERSION}" "${{ github.ref_name }}"; do
            for attempt in 1 2 3 4 5; do
              if gh release edit "$TAG" --title "Noah ${VERSION}" --notes "$NOTES" 2>/dev/null; then
                echo "Updated release notes for tag: $TAG"
                exit 0
              fi
              echo "Tag $TAG not found yet (attempt $attempt/5) — retrying in 10 s…"
              sleep 10
            done
          done
          echo "Warning: could not update release notes — release may still be processing."
          exit 0

      # ── 8b. Upload unsigned artifacts to workflow run ──────────────────────
      - name: Upload unsigned build artifacts
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: noah-mac-unsigned-${{ github.ref_name }}
          path: |
            artifacts/desktop/dist/*.dmg
            artifacts/desktop/dist/*.zip
            artifacts/desktop/dist/latest-mac.yml
          if-no-files-found: warn

      # ── 9. Confirm ─────────────────────────────────────────────────────────
      - name: List release artifacts
        working-directory: artifacts/desktop/dist
        run: ls -lh *.dmg *.zip latest-mac.yml 2>/dev/null || true
